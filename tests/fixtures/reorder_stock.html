<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Offline Reorder stock fixture</title>
<style>body{font:16px Arial;padding:24px}.gR{display:flex;gap:15px;margin:12px}.i{display:inline-grid;gap:4px;width:90px}.sr-only{position:absolute;left:-10000px}input{width:65px}td,th{padding:8px}.gR .color{width:160px}.theme tr{background:#444!important}.theme td,.theme th{color:white}</style>
<body>
<div id="order-design-details"><ul><li id="design-fixture" class="order-form-design-tab active">H-Fixture 1 - QTY: 3 View Proofs</li></ul></div>
<table class="goods-ordered"><thead><tr><th></th><th>PO</th><th>Vendor Order #</th><th>Order Date</th><th>Est. Delivery</th><th>Shipped To</th></tr></thead><tbody>
<tr data-assigned="false" ng-repeat="inventoryOrder in inventoryOrders" ng-style="inventoryOrder.assignedToCurrentSubcontractor ? {backgroundColor:'#FDFD95'} : {backgroundColor:'#EA9899'}" style="background-color:rgb(234,152,153)"><th>Sanmar</th><td>H-Fixture-OLD</td><td>12345678</td><td>10/25/2026</td><td>10/28/2026</td><td>Mach 6 Manufacturing</td></tr>
<tr data-assigned="true" ng-repeat="inventoryOrder in inventoryOrders" ng-style="inventoryOrder.assignedToCurrentSubcontractor ? {backgroundColor:'#FDFD95'} : {backgroundColor:'#EA9899'}" style="background-color:rgb(253,253,149)"><th>Sanmar</th><td>5000001</td><td></td><td>11/02/2026</td><td></td><td>M6 Print and Ship to Philly</td></tr>
</tbody></table>
<script>
window.angular={element:row=>({scope:()=>row.tagName==='TABLE'
 ? {inventoryOrders:[...row.querySelectorAll('tbody tr')].map(node=>({id:'fixture-'+node.rowIndex,assignedToCurrentSubcontractor:node.dataset.assigned==='true'}))}
 : {inventoryOrder:{id:'fixture-'+row.rowIndex,assignedToCurrentSubcontractor:row.dataset.assigned==='true'}}})};
</script></body></html>
