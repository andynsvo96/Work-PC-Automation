<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Offline S&amp;S login fixture</title>
<body>
<a href="#accessibility" id="accessibility-link">Enable accessibility</a>
<label for="newsletter">Subscribe to our newsletter</label>
<input id="newsletter" name="email" type="email">
<button type="button" id="newsletterbtn">Subscribe</button>
<form onsubmit="return false">
  <label for="M_M_zEmailTB">Email Address</label>
  <input id="M_M_zEmailTB" name="ctl00$ctl00$M$M$zEmailTB" type="email">
  <label for="M_M_zPasswordTB">Password</label>
  <input id="M_M_zPasswordTB" name="ctl00$ctl00$M$M$zPasswordTB" type="password">
  <input id="M_M_zPageLoginBTN" type="button" value="Login">
</form>
<div id="result"></div>
<script>
window.loginClicks = 0;
window.focusRedirects = 0;
for (const id of ['M_M_zEmailTB', 'M_M_zPasswordTB']) {
  document.getElementById(id).addEventListener('focus', () => {
    window.focusRedirects++;
    document.getElementById('accessibility-link').focus();
  }, {once: true});
}
document.querySelector('#M_M_zPageLoginBTN').onclick = () => {
  window.loginClicks++;
  if (document.querySelector('#M_M_zEmailTB').value !== 'account@example.test' ||
      document.querySelector('#M_M_zPasswordTB').value !== 'fixture-password') return;
  document.querySelector('#result').innerHTML = '<a href="https://www.ssactivewear.com/myaccount/signout">Sign Out</a><div id="M_M_zCart"></div>';
};
</script>
</body>
</html>
