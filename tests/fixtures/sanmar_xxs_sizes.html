<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local SanMar XXS size fixture</title>
<style>
  body { font: 16px Arial; padding: 24px; }
  table { border-collapse: collapse; }
  th, td { min-width: 100px; height: 40px; padding: 8px; }
  input { width: 60px; }
</style>
<body></body>
<script>
const params = new URLSearchParams(location.search);
const layout = params.get('layout') || 'drawer';
const sizes = ['XXS', 'XS', 'M', '2XL'];
const quantities = [1, 2, 1, 3];
const warehouse = 'Dallas, TX';
if (params.get('page') === 'inventory') {
  const drawer = layout === 'drawer';
  const stocks = [
    {warehouse: 'Robbinsville, NJ', values: [0, 80, 90, 100]},
    {warehouse, values: [30, 40, 50, 60]},
  ];
  const table = `<table>
    <thead><tr ${drawer ? 'data-testid="inventory-size-row"' : ''}>
      <th>Warehouse</th>${sizes.map(size => `<th ${drawer ? 'data-testid="inventory-size-value-cell"' : ''}>${size}</th>`).join('')}
    </tr></thead>
    <tbody>${stocks.map((row, index) => `<tr><td>${row.warehouse}</td>
      ${row.values.map((stock, sizeIndex) => `<td>${drawer ? '' : `<span>${stock}</span>`}
        <input id="qty-${index}-${sizes[sizeIndex]}" data-size="${sizes[sizeIndex]}" value="0"
          ${drawer ? `data-testid="inventory-warehouse-input-cell" data-available="${stock}"` : ''}>
      </td>`).join('')}
    </tr>`).join('')}</tbody></table>`;
  document.body.innerHTML = drawer ? `<div id="offcanvas-drawer" class="show">${table}</div>` : table;
  window.quantityChanges = {};
  document.querySelectorAll('input').forEach(input => input.addEventListener('input', () => {
    window.quantityChanges[input.id] = input.value;
  }));
} else if (layout === 'cards') {
  document.body.innerHTML = sizes.map((size, index) => `<div class="cart-item">
    Style: SXU003 Color: Navy Size: ${size} Quantity: ${quantities[index]} Warehouse: ${warehouse}
  </div>`).join('');
} else if (layout === 'labels') {
  document.body.innerHTML = `<table><tbody>${sizes.map((size, index) => `<tr>
    <td data-label="Style">SXU003</td><td data-label="Color">Navy</td>
    <td data-label="Size">${size}</td><td data-label="Quantity">${quantities[index]}</td>
    <td data-label="Warehouse">${warehouse}</td>
  </tr>`).join('')}</tbody></table>`;
} else if (layout === 'table') {
  document.body.innerHTML = `<table><thead><tr>
    <th>Style</th><th>Color</th><th>Size</th><th>Quantity</th><th>Warehouse</th>
  </tr></thead><tbody>${sizes.map((size, index) => `<tr>
    <td>SXU003</td><td>Navy</td><td>${size}</td><td>${quantities[index]}</td><td>${warehouse}</td>
  </tr>`).join('')}</tbody></table>`;
} else {
  const multiple = layout === 'multiple';
  document.body.innerHTML = `<table><thead><tr><th>Product</th><th>Color</th><th>Details</th><th>Pieces</th><th>Source</th></tr></thead><tbody>
    ${(multiple ? ['Multiple'] : sizes).map((size, index) => `<tr>
      <td class="column-style"><span class="style-number">SXU003</span></td>
      <td class="column-color"><span class="name">Navy</span></td>
      <td class="column-size">${layout === 'mobile' ? '' : size}</td>
      <td class="column-merch-qty">${layout === 'mobile' ? '' : multiple ? 7 : quantities[index]}</td>
      <td class="column-warehouse">${warehouse}</td>
      <td class="column-size-qty">${multiple ? sizes.map((value, sizeIndex) => `${value}: ${quantities[sizeIndex]}`).join(' ') : `${size}: ${quantities[index]}`}</td>
    </tr>`).join('')}
  </tbody></table>`;
}
</script>
</html>
