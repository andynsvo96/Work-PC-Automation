<!doctype html>
<meta charset="utf-8">
<title>Offline Slack delivery fixture</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  main { width: 700px; }
  #message-scroll { max-height: 240px; overflow-y: auto; }
  [data-qa="message_container"] { padding: 8px; }
  [contenteditable] { min-height: 60px; border: 1px solid; white-space: pre-wrap; }
</style>
<main>
  <div id="message-scroll"><div id="messages"></div></div>
  <div data-qa="message_input">
    <div id="composer" role="textbox" contenteditable="true" aria-label="Message fixture"></div>
    <button data-qa="texty_send_button" aria-label="Send now">Send</button>
  </div>
</main>
<aside data-qa="thread_view"><div id="thread-messages"></div></aside>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'deliver';
  const key = 'slack-delivery-fixture';
  const state = JSON.parse(localStorage.getItem(key) || '{"messages": [], "attempts": 0}');
  let draft = '';
  const persist = () => localStorage.setItem(key, JSON.stringify(state));
  function appendMessage(message) {
    const row = document.createElement('div');
    row.dataset.qa = 'message_container';
    if (!message.missingId) row.dataset.ts = message.id;
    const body = document.createElement('div');
    body.dataset.qa = 'message-text';
    body.textContent = message.text;
    if (message.link) {
      body.replaceChildren();
      const link = document.createElement('a');
      link.href = message.text;
      link.textContent = message.text.replace(/^https?:\/\//, '');
      body.append(link);
    }
    row.append(body);
    if (message.pending || message.failed) {
      const status = document.createElement('span');
      status.dataset.qa = message.pending ? 'message_pending' : 'message_send_failed';
      status.textContent = message.pending ? 'Sending...' : 'Send failed';
      row.append(status);
    }
    document.getElementById(message.thread ? 'thread-messages' : 'messages').append(row);
  }
  const scroller = document.getElementById('message-scroll');
  const restoresHistory = mode.startsWith('restore-history');
  let viewingHistory = restoresHistory && (state.attempts > 0 || mode === 'restore-history-clear');
  if (viewingHistory) {
    // Slack can restore an older virtual-list position after refresh. The sent
    // message is persisted but is not mounted until the user scrolls to latest.
    for (let index = 0; index < 25; index++) {
      appendMessage({ id: (Date.now() / 1000 - 86400 + index).toFixed(6), text: 'Earlier conversation ' + index });
    }
    scroller.addEventListener('scroll', () => {
      if (scroller.scrollTop + scroller.clientHeight < scroller.scrollHeight - 1) return;
      document.getElementById('messages').replaceChildren();
      viewingHistory = false;
      state.messages.forEach(appendMessage);
    }, { once: true });
  } else {
    state.messages.forEach(appendMessage);
  }
  composer.addEventListener('input', event => {
    if (event.isTrusted) draft = composer.innerText.trim();
  });
  composer.addEventListener('keydown', event => {
    // Emulate either Enter preference: typing a multiline draft must not send.
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      document.querySelector('button').click();
    }
  });
  document.querySelector('button').addEventListener('click', () => {
    state.attempts++;
    const message = { id: (Date.now() / 1000).toFixed(6), text: draft };
    composer.replaceChildren();
    draft = '';
    if (mode === 'detach') composer.replaceWith(composer.cloneNode());
    if (mode === 'clear' || mode === 'detach' || mode === 'restore-history-clear' || !message.text) {
      persist();
      return;
    }
    if (mode === 'thread') message.thread = true;
    if (mode === 'pending' || mode === 'restore-history-pending') message.pending = true;
    if (mode === 'failed') message.failed = true;
    if (mode === 'missing-id') message.missingId = true;
    if (mode === 'link' || mode === 'restore-history-link') message.link = true;
    if (mode !== 'optimistic' && mode !== 'restore-history-optimistic') state.messages.push(message);
    persist();
    if (mode !== 'after-refresh') appendMessage(message);
  });
  window.addOldMessage = (text, age = 60) => {
    const message = { id: (Date.now() / 1000 - age).toFixed(6), text };
    state.messages.push(message);
    persist();
    if (!viewingHistory) appendMessage(message);
  };
</script>
