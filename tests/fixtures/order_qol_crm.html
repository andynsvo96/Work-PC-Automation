<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Offline order QOL fixture</title>
<style>
  body { font: 14px Arial, sans-serif; margin: 24px; color: #263244; background: #f5f7fa; }
  #view-orders-index { max-width: 1040px; margin: auto; }
  #content { display: flow-root; }
  #left-column, #right-column { box-sizing: border-box; float: left; width: 25%; padding: 10px; }
  #main-content { box-sizing: border-box; float: left; width: 50%; padding: 10px; }
  #order-design-details { box-sizing: border-box; width: 100%; clear: both; }
  #order-notes { margin: 12px 0; }
  @media (max-width: 991px) { #left-column, #right-column, #main-content { float: none; width: 100%; } }
  .btn { font: inherit; padding: 8px 12px; background: white; border: 1px solid #bcc8d6; border-radius: 4px; cursor: pointer; }
  .btn-primary { background: #245888; color: white; }
  .btn-success { background: #267c4a; color: white; }
  button:disabled { opacity: .5; cursor: default; }
  .ng-hide, .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .btn-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 22px 0; }
  .nav-tabs { display: flex; align-items: center; flex-wrap: wrap; list-style: none; padding: 0; }
  .nav-tabs a { display: block; padding: 9px 14px; color: inherit; }
  .nav-tabs .active { background: #e2edff; }
  .order-inventory { padding: 14px; background: white; border: 1px solid #cbd5e1; }
  th, td { padding: 7px 12px; text-align: left; }
  #native-preview { padding: 25px; text-align: center; background: #e4e8ee; margin-top: 30px; }
  .row { margin-left: -10px; margin-right: -10px; }
  .row::after { content: ''; display: table; clear: both; }
  .print-area-column { float: left; width: 50%; box-sizing: border-box; padding: 10px; }
  .printarea { padding: 14px; background: white; border: 1px solid #cbd5e1; margin-bottom: 12px; }
  .printarea input { max-width: 100%; box-sizing: border-box; }
  .panel { margin: 18px 0; background: white; border: 1px solid #cbd5e1; }
  .panel-heading { padding: 12px 16px; background: #245888; color: white; cursor: pointer; }
  .panel-title { margin: 0; font: bold 14px Arial; }
  .panel-body { padding: 16px; }
</style>
<main id="view-orders-index">
  <header id="main-header">
  <h1>Order 1234567</h1>
  <button class="btn" id="invoice">Send Invoice</button>
  <button class="btn btn-primary edit-btn" ng-click="editModeOn();">edit order</button>
  <button class="btn save-btn" ng-click="saveOrder();">save order</button>
  <div id="main-header-design-tabs"><div class="btn-group" role="group"></div></div>
  </header>
  <!-- Mirror CRM's 25% / 50% / 25% columns, with native forms and print-area
       rows inside the middle column. Preview checks preserve this layout. -->
  <section id="content">
  <aside id="left-column">
    <section id="contact-panel" class="panel"><div class="panel-heading"><h3 class="panel-title">Contact Info and Send Options</h3></div><div class="panel-body"><button class="btn" ng-click="addAccount()">Add Account</button></div></section>
  </aside>
  <section id="main-content">
    <div class="row"><p>Native order assignments</p></div>
    <div id="order-notes" class="row"><label>Order notes <input value="Keep this order note"></label></div>
    <div id="order-design-details" class="row col-md-12"><ul class="nav nav-tabs"></ul><div class="tab-content"></div></div>
    <div class="row"><section id="native-preview">Native Design Studio Previews</section></div>
  </section>
  <aside id="right-column">
  <section id="order-purchase-orders" class="panel"><div class="panel-heading"><h3 class="panel-title">Purchase Orders</h3></div><div class="panel-body"><button>+ purchase order</button></div></section>
  <section id="order-promos" class="panel"><div class="panel-heading"><h3 class="panel-title">Promos</h3></div><div class="panel-body"><button>add promo</button></div></section>
  <section id="order-cartons" class="panel"><div class="panel-heading"><h3 class="panel-title">Carton Tracking</h3></div><div class="panel-body">Carton / Tracking No.</div></section>
  <section id="sales-tax-transactions" class="panel"><div class="panel-heading"><h3 class="panel-title">Sales Tax Transactions</h3></div><div class="panel-body">Order / Shipping / Sales Tax / State / Date</div></section>
  </aside>
  </section>
</main>
<script>
// Image requests are replaced with local SVGs, so testing never contacts CRM or
// the artwork site. Keep the requested URL available for checking its parameters.
const imageSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
Object.defineProperty(HTMLImageElement.prototype, 'src', {
  get() { return this.dataset.requestedSrc || imageSrc.get.call(this); },
  set(value) {
    if (!String(value).startsWith('https://preview.example.test/')) return imageSrc.set.call(this, value);
    this.dataset.requestedSrc = value;
    const src = new URL(value).searchParams.get('src');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 420"><rect width="395" height="420" fill="#edf0f4"/><path d="M125 40L40 85 15 165 95 190 108 360H287L300 190 380 165 355 85 270 40Q197 95 125 40Z" fill="#cbd1d9" stroke="#adb5c2" stroke-width="3"/><text x="197" y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#45556c">${src}</text></svg>`;
    imageSrc.set.call(this, 'data:image/svg+xml,' + encodeURIComponent(svg));
    if (src.endsWith('_t')) setTimeout(() => this.dispatchEvent(new Event('error')), 0);
  }
});
window.resource = { id: '1234567', features: { approved: false, releasedToVendor: 0 }, featureFlags: { stockOrderingLocked: false },
  designs: [0,1,2].map(index => ({ id: String(100 + index), designId: String(20000 + index),
    printAreas: ['Front','Back'].map((description, area) => ({id: String(1000+index*10+area), description, printMethodDescription: 'HD Digital', width: '12'})),
    designItems: [{id: String(500 + index), productId: '10', colorId: '20', quantity: 1, sizes: []}] })) };
window.fixtureStock = JSON.parse(sessionStorage.getItem('fixture-native-stock') || 'null') ||
  { ordered: [true, false, false], disabled: [false, false, false], hidden: [false, false, false] };
window.fixtureVendorCellTag = 'th';
window.fixtureVendor = false;
window.fixtureSubcontractor = new URLSearchParams(location.search).has('subcontractor');
window.fixtureVendorPOCalls = 0;
window.queueCalls = [];
window.queueMode = 'success';
window.fixtureQueueResolvers = [];
window.nativeGoodsClicks = 0;
window.nativeCalls = JSON.parse(sessionStorage.getItem('fixture-native-calls') || '[]');
window.pendingNative = new Map();
window.nativeMode = 'hold';
window.nativeReloads = 0;
const originalTimeout = window.setTimeout.bind(window);
window.setTimeout = (fn, delay, ...args) => {
  if (delay === 1500) { nativeReloads++; return -1; } // Hold the final refresh for assertions.
  return originalTimeout(fn, delay, ...args);
};
window.fixtureRuntime = { runKind: 'manual', orderId: '1234567', queued: false, running: false, lastSuccess: null };
window.orderScope = {
  order: { getResource: () => resource }, editMode: new URLSearchParams(location.search).has('edit'), activeDesignIndex: 1, transfersOnly: false,
  ENV_CONFIG: { rushorderteesURL: 'https://preview.example.test/' },
  user: { isAny: role => fixtureVendor && role === 'vendor' },
  saveOrder() { this.editMode = false; renderFixture(); },
  editModeOn() { this.editMode = true; renderFixture(); }
};
window.inventoryService = {
  orderGoodsSupplynet(designId) {
    nativeCalls.push(String(designId));
    sessionStorage.setItem('fixture-native-calls', JSON.stringify(nativeCalls));
    const index = resource.designs.findIndex(design => design.id === String(designId));
    return new Promise((resolve, reject) => {
      pendingNative.set(String(designId), { resolve(response) {
        if (response?.succeeded && response.supplier) {
          fixtureStock.ordered[index] = true;
          sessionStorage.setItem('fixture-native-stock', JSON.stringify(fixtureStock));
        }
        resolve(response);
      }, reject });
      if (nativeMode === 'success') originalTimeout(() => pendingNative.get(String(designId)).resolve({succeeded:true,supplier:'Sanmar'}), 20);
    });
  }
};
window.inventoryScopes = resource.designs.map((design, index) => ({
  providers: [{id:null,vendor:'Sanmar / S&S Activewear',allStockOrdered:false,stockOrdered:false,goodsPreviouslyOrdered:false}, {id:210,vendor:'Manual Order'}],
  design: () => resource.designs[index], order: () => orderScope.order, itemCount: 1, placingOrder: false,
  isOrderingLocked: provider => provider.id === null && resource.featureFlags.stockOrderingLocked,
  orderGoods(provider) { nativeGoodsClicks++; if (provider.id === null) return inventoryService.orderGoodsSupplynet(design.id); },
  $root: {$$phase:false}, $apply(fn) { try { return fn(); } finally { renderFixture(); } }
}));
window.angular = { element: node => ({
  scope() {
    const inventory = node?.closest?.('[order-inventory]');
    if (!inventory) return orderScope;
    const owner = inventoryScopes[Number(inventory.dataset.designIndex)];
    const row = node?.closest('tr[ng-repeat="provider in providers"]');
    return row ? {provider: owner.providers[row === inventory.querySelector('tr') ? 0 : 1], $parent:owner} : orderScope;
  },
  isolateScope() { const inventory = node?.closest?.('[order-inventory]'); return inventory ? inventoryScopes[Number(inventory.dataset.designIndex)] : null; },
  injector: () => ({ get(name) { if (name !== 'orders/inventory/InventorySrv') throw new Error('Unknown service'); return inventoryService; } })
}) };
window.fixtureResetStock = () => {
  nativeCalls = []; nativeReloads = 0;
  fixtureStock = { ordered: [true,false,false], disabled:[false,false,false], hidden:[false,false,false] };
  renderFixture();
};
window.chrome = {
  tabs: { async query() { return [{id: 1}]; }, async sendMessage() { return {isOrderDocument: true, active: false}; } },
  runtime: {
    onMessage: { addListener() {} },
    async sendMessage(message) {
      if (message.type === 'crm-dark-mode:get-theme') return { enabled: false };
      if (message.type === 'crm-dark-mode:get-bridge-status') return { connected: false, message: 'Offline fixture' };
      if (message.type === 'crm-order-automation:status') return { success: true, runtime: fixtureRuntime };
      if (message.type === 'crm-order-automation:manual-start') {
        queueCalls.push(structuredClone(message));
        if (queueMode === 'uncertain') return { success: false, message: 'The task may already be queued. Check the Automation queue.' };
        if (queueMode === 'reject') return { success: false, message: 'Local Automation app is not reachable.' };
        if (queueMode === 'throw') throw new Error('Disconnected');
        fixtureRuntime = { ...fixtureRuntime, queued: true };
        if (queueMode === 'hold') await new Promise(resolve => fixtureQueueResolvers.push(resolve));
        return { success: true, runtime: fixtureRuntime };
      }
      return { success: true };
    }
  },
  storage: { local: {
    async get(keys) { return Object.fromEntries(keys.map(key => [key, JSON.parse(localStorage.getItem('fixture-extension:'+key) || 'null')])); },
    async set(values) {
      if (window.fixtureStorageFail) throw Error('Fixture storage failure');
      const changes = {};
      for (const [key, value] of Object.entries(values)) {
        changes[key] = { newValue: value };
        localStorage.setItem('fixture-extension:'+key, JSON.stringify(value));
      }
      fixtureStorageListeners.forEach(fn => fn(changes, 'local'));
    }
  }, onChanged: { addListener(fn) { fixtureStorageListeners.push(fn); } } }
};
window.fixtureStorageListeners = [];
window.addEventListener('storage', event => {
  if (event.key?.startsWith('fixture-extension:')) fixtureStorageListeners.forEach(fn => fn({
    [event.key.slice('fixture-extension:'.length)]: { newValue: JSON.parse(event.newValue || 'null') }
  }, 'local'));
});
window.fixtureHeaderClicks = 0;
document.querySelectorAll('.panel-heading').forEach(node => node.addEventListener('click', () => fixtureHeaderClicks++));
function renderFixture() {
  document.querySelector('.edit-btn').classList.toggle('ng-hide', orderScope.editMode);
  document.querySelector('.save-btn').classList.toggle('ng-hide', !orderScope.editMode);
  document.querySelector('#native-preview').classList.toggle('ng-hide', orderScope.editMode);
  const vendorPO = document.getElementById('order-vendor-po-panel');
  if (!fixtureSubcontractor || orderScope.editMode) vendorPO?.parentElement.remove();
  else if (!vendorPO) {
    // Sanitized structure from the subcontractor order snapshot. Keep the
    // native role/edit visibility gate outside the extension's preferences.
    const wrapper = document.createElement('div');
    wrapper.className = 'row';
    wrapper.setAttribute('ng-if', "!editMode && showVendorPO && user.isAny('admin', 'owner', 'productionmanager', 'vendor')");
    wrapper.innerHTML = `<div id="order-vendor-po-panel" class="panel panel-default">
      <div class="panel-heading"><a class="clickable" ng-click="collapse('order-vendor-po-panel');"><strong>Vendor Purchase Order</strong></a></div>
      <div class="panel-body collapse in"><div id="order-vendor-po"><button type="button">create purchase order</button><p>Notes</p></div></div>
    </div>`;
    wrapper.querySelector('.panel-heading').onclick = () => {
      fixtureHeaderClicks++;
      const body = wrapper.querySelector('.panel-body'); body.hidden = !body.hidden;
    };
    wrapper.querySelector('button').onclick = () => fixtureVendorPOCalls++;
    document.getElementById('main-content').append(wrapper);
  }
  const header = document.querySelector('#main-header-design-tabs .btn-group');
  const nav = document.querySelector('#order-design-details .nav-tabs');
  const content = document.querySelector('#order-design-details .tab-content');
  header.querySelectorAll('button[ng-repeat]').forEach(node => node.remove());
  nav.querySelectorAll('.order-form-design-tab').forEach(node => node.remove());
  content.replaceChildren();
  resource.designs.forEach((design, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn' + (index === orderScope.activeDesignIndex ? ' btn-primary' : '');
    button.setAttribute('ng-repeat', '(designIndex, design) in order.getResource().designs');
    button.textContent = `${index + 1} - QTY: 1 Design Previews`;
    button.onclick = () => { orderScope.activeDesignIndex = index; renderFixture(); };
    header.append(button);
    const tab = document.createElement('li');
    tab.className = 'order-form-design-tab' + (index === orderScope.activeDesignIndex ? ' active' : '');
    const link = document.createElement('a');
    link.textContent = 'Tab ' + (index + 1);
    link.onclick = button.onclick;
    tab.append(link);
    nav.append(tab);
    const pane = document.createElement('div');
    pane.className = 'tab-pane' + (index === orderScope.activeDesignIndex ? ' active' : '');
    const inventory = document.createElement('div');
    inventory.className = 'order-inventory';
    inventory.setAttribute('order-inventory', 'design');
    inventory.dataset.designIndex = index;
    // CRM uses a header cell for the vendor, followed by separate action cells.
    // The data-cell variant checks compatibility with older table markup.
    const cell = fixtureVendorCellTag;
    inventory.innerHTML = `<table class="order-goods"><tbody>
      <tr ng-repeat="provider in providers" ng-hide="provider.allStockOrdered &amp;&amp; !provider.forceDisplay" class="${fixtureStock.hidden[index] ? 'ng-hide' : ''}">
        <${cell} class="ng-binding">Sanmar / S&amp;S Activewear</${cell}>
        <td><div ng-hide="provider.goodsPreviouslyOrdered || pullStock || provider.stockOrdered" class="${fixtureStock.ordered[index] ? 'ng-hide' : ''}">
          <button type="button" ng-click="orderGoods(provider);" ${fixtureStock.disabled[index] || inventoryScopes[index].placingOrder ? 'disabled' : ''}>Order Goods</button>
        </div></td>
        <td><button type="button" ng-click="orderGoodsAddBox(provider);">Add Box</button></td>
      </tr>
      <tr ng-repeat="provider in providers"><${cell}>Manual Order</${cell}><td><button type="button" ng-click="orderGoods(provider);">Order Goods</button></td></tr>
    </tbody></table>`;
    inventory.querySelectorAll('button').forEach(button => button.onclick = () => inventoryScopes[index].orderGoods(
      inventoryScopes[index].providers[button.closest('tr') === inventory.querySelector('tr') ? 0 : 1]));
    const form = document.createElement('div');
    form.className = 'content';
    form.setAttribute('ng-form', 'designForm');
    form.append(inventory);
    const areas = document.createElement('div');
    areas.className = 'row';
    for (const area of design.printAreas) {
      const column = document.createElement('div');
      column.className = 'col-md-6 print-area-column';
      column.setAttribute('ng-repeat', '(areaIndex, area) in design.printAreas');
      column.innerHTML = `<div class="panel printarea"><h3>${area.description} / ${area.printMethodDescription}</h3><label>Width <input value="${area.width}"></label><p>Keep print area notes and artwork</p></div>`;
      areas.append(column);
    }
    form.append(areas);
    pane.append(form);
    content.append(pane);
  });
}
document.querySelector('.edit-btn').onclick = () => orderScope.editModeOn();
document.querySelector('.save-btn').onclick = () => orderScope.saveOrder();
renderFixture();
</script></html>
