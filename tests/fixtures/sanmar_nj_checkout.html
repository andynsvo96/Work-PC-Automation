<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local SanMar routing and CRM Add box fixture</title>
<style>
  body { font: 16px Arial; padding: 24px; }
  label, select, input, button { margin: 8px; }
  .modal { display: none; padding: 16px; border: 1px solid #888; }
  textarea { width: 600px; height: 160px; }
</style>
<body></body>
<script>
const page = new URLSearchParams(location.search).get('page') || 'checkout';
const warehouseNames = {nj: 'Robbinsville, NJ', va: 'Richmond, VA', az: 'Phoenix, AZ', nv: 'Reno, NV'};
const sources = (new URLSearchParams(location.search).get('warehouses') || 'nj').split(',').map((key) => warehouseNames[key]);
const body = document.body;
const escapeText = (text) => String(text).replace(/[&<>"']/g, (ch) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
if (page === 'checkout') {
  body.innerHTML = `
    <h1>Shipping Details</h1>
    <div><label><input id="ship" type="radio" name="fulfillment" checked>Ship to an address</label></div>
    <div><label><input id="pickup" type="radio" name="fulfillment">Pick Up at warehouse</label>
      <select id="warehouse"><option>Select warehouse</option><option value="nj">Robbinsville, NJ</option><option>Richmond, VA</option></select>
    </div>
    <div><label><input type="radio" name="address" value="123 EZ TEES INC" checked>123 EZ TEES INC</label>
      <label><input type="radio" name="address" value="Mach 6 Manufacturing">Mach 6 Manufacturing (CA)</label></div>
    <section id="saved-addresses"></section>
    <button id="confirm-address">Confirm Address</button>
    <section id="shipping-methods"></section>
    <button id="payment">Proceed To Payment</button>`;
  window.fixtureSetSavedAddresses = (entries) => {
    window.fixtureSavedAddresses = entries;
    document.querySelector('#saved-addresses').innerHTML = '<h2>Saved Addresses</h2><ul>' + entries.map((entry, index) => `
      <li><table><tbody><tr>
        <td><input type="radio" name="shippingAddress" id="saved-address-${index}" value="${index}"></td>
        <td><label for="saved-address-${index}"><span class="savedName saved-name">${escapeText(entry.name)}</span><br>
          <span class="saved-add-1">${escapeText(entry.line1)}</span><br><span class="saved-add-2">${escapeText(entry.line2 || '')}</span></label></td>
        <td><span class="saved-city">${escapeText(entry.city)}</span>, <span class="saved-state">${escapeText(entry.state)}</span></td>
        <td><span class="saved-zip">${escapeText(entry.zip)}</span></td>
      </tr></tbody></table></li>`).join('') + '</ul>';
  };
  document.querySelector('#confirm-address').onclick = () => {
    document.querySelector('#shipping-methods').innerHTML = '<h2>Shipping Method</h2>' + sources.map((name, index) => `
      <h3>Warehouse: ${escapeText(name)}</h3><table><tbody>
        <tr><td><label><input type="radio" name="method-${index}" value="fedex" checked>FedEx Oct 6, 2026</label></td></tr>
        <tr><td><label><input type="radio" name="method-${index}" value="ups">UPS Ground Oct 6, 2026</label></td></tr>
      </tbody></table>`).join('');
  };
  document.querySelector('#payment').onclick = () => {
    const pickup = document.querySelector('#pickup').checked;
    const warehouse = document.querySelector('#warehouse').selectedOptions[0].textContent;
    const savedAddress = document.querySelector('input[name="shippingAddress"]:checked');
    const destination = savedAddress ? window.fixtureSavedAddresses[Number(savedAddress.value)] : null;
    const address = destination ? destination.name : document.querySelector('input[name="address"]:checked').value;
    const methods = sources.map((name, index) => ({warehouse: name, method: document.querySelector(`input[name="method-${index}"]:checked`)?.value || ''}));
    window.fixtureFulfillment = { pickup, warehouse, address, methods };
    body.innerHTML = `<h1>Review &amp; Submit</h1><p>Payment method: Net</p>
      ${pickup ? `<p>Pickup: ${escapeText(warehouse)}</p>` : `<section id="ship-to"><h2>Ship To</h2><p>${escapeText(address)}</p>${destination ? `<p>${escapeText(destination.line1)} ${escapeText(destination.line2 || '')}</p><p>${escapeText(destination.city)}, ${escapeText(destination.state)} ${escapeText(destination.zip)}</p>` : ''}</section>` + methods.map(({warehouse, method}) => `<p>Warehouse: ${escapeText(warehouse)} Shipping Method: ${method === 'ups' ? 'UPS Ground' : 'FedEx'}</p>`).join('')}
      <label for="po">Customer PO</label><input id="po" name="customerPo" style="width:320px">
      <button id="submit">Submit Order</button>`;
    document.querySelector('#submit').onclick = () => {
      const po = document.querySelector('#po').value;
      body.innerHTML = `<h1>Thank You For Your Order</h1><p>Web Reference: LOCAL-FIXTURE</p><p>Customer PO: ${escapeText(po)}</p>`;
    };
  };
} else {
  const rows = JSON.parse(localStorage.getItem('fixture_rows') || '[]');
  const notes = localStorage.getItem('fixture_notes') || '';
  const due = localStorage.getItem('fixture_due') || '2026-12-07';
  const production = localStorage.getItem('fixture_production') || '2026-11-30';
  const dateLabel = value => value.slice(5, 7) + '/' + value.slice(8, 10) + '/' + value.slice(2, 4);
  body.innerHTML = `<h1>Order 5000001 — H-CJVillafra302</h1>
    <div><label>Due Date:</label> <span id="due-value">${dateLabel(due)}</span><input type="date" name="Fulfillment Date" id="due-input" value="${due}" style="display:none"></div>
    <div><label>Production Date:</label> <span id="production-value">${dateLabel(production)}</span><input type="date" name="Production Date" id="production-input" value="${production}" style="display:none"></div>
    <section><h2>Order Goods from Vendor: Manual Order</h2>
      <button id="order-goods">Order Goods</button><button id="add-box">Add box</button>
      <table id="stock-rows"></table>
    </section>
    <div class="modal"><div class="modal-content"><h2>Manual Order</h2>
      <input id="manual-po"><select id="vendor"><option>Select vendor</option><option>Sanmar</option></select>
      <button id="manual-save">Save</button>
    </div></div>
    <section><h2>Sales Notes</h2><textarea id="sales-note-input" style="display:none">Existing sales note</textarea></section>
    <section><h2>Production Notes</h2><pre id="notes"></pre>
      <button id="edit">Edit Order</button><textarea id="note-input" style="display:none"></textarea>
      <button id="save-order" style="display:none">Save Order</button>
    </section>`;
  window.fixtureSetProductionNotes = entries => {
    let root = document.querySelector('#order-notes-production-notes');
    if (!root) {
      root = document.createElement('section');
      root.id = 'order-notes-production-notes';
      body.append(root);
    }
    root.innerHTML = '<h2>Production Notes</h2>' + entries.map(entry => `<div class="notes-envelope"><div class="notes-user">Fixture user <span class="notes-date">${escapeText(entry.timestamp)}</span></div><div class="notes-body">${escapeText(entry.text)}</div></div>`).join('');
  };
  const renderRows = () => {
    document.querySelector('#stock-rows').innerHTML = rows.map((po) => `<tr style="background:rgb(255,255,150)"><td>Sanmar ${escapeText(po)}-Sanmar</td></tr>`).join('');
  };
  renderRows();
  document.querySelector('#notes').textContent = notes;
  for (const id of ['order-goods', 'add-box']) {
    document.getElementById(id).onclick = () => {
      const clicks = JSON.parse(localStorage.getItem('fixture_clicks') || '[]');
      clicks.push(id);
      localStorage.setItem('fixture_clicks', JSON.stringify(clicks));
      document.querySelector('.modal').style.display = 'block';
      document.querySelector('#manual-po').value = '';
    };
  }
  document.querySelector('#manual-save').onclick = () => {
    rows.push(document.querySelector('#manual-po').value);
    localStorage.setItem('fixture_rows', JSON.stringify(rows));
    document.querySelector('.modal').style.display = 'none';
    renderRows();
  };
  document.querySelector('#edit').onclick = () => {
    document.querySelector('#edit').style.display = 'none';
    document.querySelector('#note-input').style.display = 'block';
    document.querySelector('#note-input').value = localStorage.getItem('fixture_notes') || '';
    document.querySelector('#sales-note-input').style.display = 'block';
    document.querySelector('#save-order').style.display = 'inline-block';
    document.querySelector('#due-input').style.display = 'inline-block';
    document.querySelector('#production-input').style.display = 'inline-block';
  };
  document.querySelector('#save-order').onclick = () => {
    const note = document.querySelector('#note-input').value;
    const failures = Number(localStorage.getItem('fixture_note_save_failures') || '0');
    if (failures > 0) localStorage.setItem('fixture_note_save_failures', String(failures - 1));
    else {
      localStorage.setItem('fixture_notes', note);
      document.querySelector('#notes').textContent = note;
    }
    localStorage.setItem('fixture_sales_notes', document.querySelector('#sales-note-input').value);
    document.querySelector('#edit').style.display = 'inline-block';
    document.querySelector('#note-input').style.display = 'none';
    document.querySelector('#sales-note-input').style.display = 'none';
    document.querySelector('#save-order').style.display = 'none';
    localStorage.setItem('fixture_due', document.querySelector('#due-input').value);
    localStorage.setItem('fixture_production', document.querySelector('#production-input').value);
    document.querySelector('#due-value').textContent = dateLabel(document.querySelector('#due-input').value);
    document.querySelector('#production-value').textContent = dateLabel(document.querySelector('#production-input').value);
    document.querySelector('#due-input').style.display = 'none';
    document.querySelector('#production-input').style.display = 'none';
  };
}
</script>
</html>
